services:
  - type: web
    name: threadloom-backend
    runtime: python
    plan: free
    rootDir: backend
    # seed_catalog and ensure_superuser are both idempotent (update_or_create /
    # skip-if-exists) — safe to run on every build. The free plan has no Shell
    # access for one-off commands, so this is the only place to run them.
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py seed_catalog && python manage.py ensure_superuser"
    # The image-upload pipeline runs inline in the request (no Celery worker
    # on this plan, CELERY_ALWAYS_EAGER=True), so the web process has to
    # survive doing real image work mid-request:
    #
    # --worker-class gthread --threads 2: a single sync worker is fully
    # occupied for the whole upload and can't answer Render's own health
    # check meanwhile — Render then declares the instance unhealthy and
    # force-restarts it (plain SIGTERM, no gunicorn timeout involved),
    # killing the in-flight request. Confirmed in the Render logs, not
    # theoretical. A second thread keeps the health check answerable, and
    # numpy/opencv release the GIL during their C-level compute so it runs
    # genuinely concurrently rather than queueing.
    #
    # --workers 1: one process keeps peak memory inside the 512MB limit.
    # --timeout 120: headroom over the default 30s. The pipeline is now
    # sub-second on flat artwork, but GrabCut on a large photo plus vector
    # tracing is the slow path worth allowing for.
    startCommand: "gunicorn threadloom.wsgi:application --timeout 120 --workers 1 --worker-class gthread --threads 2"
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOW_ALL
        value: "False"
      # Set to your Vercel URL once the frontend is deployed, e.g.
      # https://your-app.vercel.app — comma-separate if there's more than one.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Set to this service's own onrender.com URL, e.g.
      # https://threadloom-backend.onrender.com — needed for Django admin
      # login to work behind Render's proxy.
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: USE_POSTGRES
        value: "True"
      # Paste a Neon connection string (use the pooled one, host has
      # "-pooler" in it) with ?sslmode=require.
      - key: DATABASE_URL
        sync: false
      - key: USE_S3
        value: "True"
      # Backblaze B2 credentials — keyID/applicationKey from an Application
      # Key scoped to the bucket, not AWS.
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      # Full endpoint, e.g. https://s3.us-west-002.backblazeb2.com
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      # The region segment out of that same endpoint, e.g. us-west-002 —
      # B2 doesn't support the 'auto' shortcut Cloudflare R2 does.
      - key: AWS_S3_REGION_NAME
        sync: false
      # No Redis/worker on the free tier — tasks run inline instead.
      - key: CELERY_ALWAYS_EAGER
        value: "True"
      # First admin/staff login — created once by ensure_superuser (see
      # accounts/management/commands/ensure_superuser.py), then left alone
      # even if these values change later.
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
